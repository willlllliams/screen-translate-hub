<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<style>
  html, body { margin: 0; height: 100%; background: #202124; color: #eee; font: 12px "Segoe UI", sans-serif; overflow: hidden; }
  #bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #2d2e31; -webkit-app-region: drag; }
  #bar button { -webkit-app-region: no-drag; background: #3c3d41; color: #eee; border: 0; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #bar .grow { flex: 1; }
  #stage { position: absolute; top: 30px; left: 0; right: 0; bottom: 0; }
  #img, #root { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="bar"><span>Screenshot translation</span><span class="grow"></span><button id="toggle">Original</button><button id="close">✕</button></div>
<div id="stage"><canvas id="img"></canvas><div id="root"></div></div>
<script src="card.js"></script>
</body>
</html>
