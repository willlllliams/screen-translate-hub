<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bubble { position: absolute; max-width: 360px; padding: 8px 10px; border-radius: 10px; background: rgba(32,33,36,.95); color: #fff; font: 14px "Microsoft YaHei UI", "Segoe UI", sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.4); white-space: pre-wrap; }
  .label { position: absolute; padding: 2px 6px; border-radius: 4px; color: #fff; font: 12px "Segoe UI", sans-serif; }
</style>
</head>
<body>
<svg id="svg"></svg>
<div id="html"></div>
<script src="annotations.js"></script>
</body>
</html>
