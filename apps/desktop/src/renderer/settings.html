<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>screen-translate-hub settings</title>
<style>
  body { margin: 0; padding: 16px 20px 60px; font: 13px "Segoe UI", "Microsoft YaHei UI", sans-serif; color: #1f1f1f; background: #f6f6f8; }
  h2 { font-size: 14px; margin: 18px 0 8px; color: #444; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; background: #fff; }
  label { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 8px; margin: 6px 0; }
  input[type=text], input[type=number], select, textarea { font: inherit; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
  textarea { width: 100%; height: 140px; font-family: Consolas, monospace; font-size: 12px; box-sizing: border-box; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #bbb; border-radius: 4px; background: #fff; cursor: pointer; }
  #save { position: fixed; right: 20px; bottom: 14px; background: #2563eb; color: #fff; border: 0; padding: 8px 18px; }
  #msg { position: fixed; left: 20px; bottom: 20px; color: #2a7; }
  .hint { color: #777; font-size: 12px; }
</style>
</head>
<body>
<h2>Translation</h2>
<fieldset>
  <label>Target language <select id="target_language">
    <option value="zh-Hans">简体中文 zh-Hans</option><option value="zh-Hant">繁體中文 zh-Hant</option>
    <option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option>
    <option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option>
  </select></label>
  <div class="hint">Translation sources, highest priority first. The first one is the preferred source: only its complete translation is final; the others show until it answers.</div>
  <textarea id="translators"></textarea>
  <div class="row">
    <button data-add="claude">+ Claude Code (haiku)</button>
    <button data-add="openai">+ OpenAI-compatible</button>
    <button data-add="anthropic">+ Anthropic API</button>
    <button data-add="bergamot">+ Bergamot (offline)</button>
    <button data-add="mock">+ Mock (testing)</button>
  </div>
</fieldset>

<h2>Display</h2>
<fieldset>
  <label>Mode <select id="mode"><option value="plate">Plate under each paragraph</option><option value="dim">Dim the whole screen</option></select></label>
  <label>Plate opacity <input id="plate_opacity" type="number" min="0" max="1" step="0.05"></label>
  <label>Brightness (dim mode) <input id="brightness" type="number" min="0" max="1" step="0.05"></label>
  <label>Font scale <input id="font_scale" type="number" min="0.5" max="3" step="0.05"></label>
  <label>Minimum font (px) <input id="min_font_px" type="number" min="6" max="40" step="1"></label>
  <label>Screenshot result <select id="screenshot_placement"><option value="inplace">Drawn in place</option><option value="card">Floating card</option></select></label>
</fieldset>

<h2>Continuous screen</h2>
<fieldset>
  <label>Range <select id="range"><option value="display">Primary display</option><option value="follow_active_window">Follow the active window</option><option value="window_under_cursor">Window under the cursor</option></select></label>
  <label>Capture interval (ms) <input id="interval_ms" type="number" min="100" max="60000" step="50"></label>
</fieldset>

<h2>LAN viewer</h2>
<fieldset>
  <label>Enabled <input id="viewer_enabled" type="checkbox"></label>
  <label>Port <input id="viewer_port" type="number" min="1024" max="65535"></label>
  <label>Only this computer <input id="viewer_local" type="checkbox"></label>
  <label>Access token <input id="viewer_token" type="text"></label>
  <label>Share this screen <input id="sharing" type="checkbox"></label>
</fieldset>

<h2>Hotkeys</h2>
<fieldset id="hotkeys"></fieldset>

<h2>AI assistant</h2>
<fieldset>
  <label>Brain <select id="brain"><option value="claude-code">Claude Code (this PC)</option><option value="pi">pi agent framework</option></select></label>
  <label>Model <input id="assistant_model" type="text"></label>
  <label>pi provider <input id="pi_provider" type="text" placeholder="anthropic, openai, google ..."></label>
  <label>pi API key <input id="pi_api_key" type="text"></label>
  <label>Heartbeat (ms) <input id="heartbeat_ms" type="number" min="1000" step="500"></label>
  <label>Gate <select id="gate"><option value="rules">Rules</option><option value="jev">jev model</option><option value="composite">Rules + jev</option></select></label>
  <label>jev API key <input id="jev_api_key" type="text"></label>
</fieldset>

<span id="msg"></span>
<button id="save">Save</button>
<script src="settings.js"></script>
</body>
</html>
