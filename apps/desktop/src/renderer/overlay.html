<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #root { position: absolute; inset: 0; }
  #tip { position: absolute; display: none; box-sizing: border-box; max-width: 480px; padding: 6px 8px; border-radius: 6px; background: rgba(250,250,250,.97); color: #111; font: 13px "Segoe UI", sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.35); white-space: pre-wrap; overflow: hidden; z-index: 10; }
</style>
</head>
<body>
<div id="root"></div>
<div id="tip"></div>
<script src="overlay.js"></script>
</body>
</html>
